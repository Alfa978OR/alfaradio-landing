<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Alfa Radio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Alfa Radio – Christian radio broadcasting in Siswati and other languages.">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    main {
      text-align: center;
      max-width: 500px;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    p {
      opacity: 0.9;
    }
    a.button {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.8rem 1.2rem;
      background: #22c55e;
      color: #052e16;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
    }
    a.button:hover {
      background: #16a34a;
    }
  </style>
  .logo {
  max-width: 180px;
  width: 100%;
  height: auto;
  margin-bottom: 1.2rem;
}

</head>
<body>
<main>
  <img src="alfa-logo-landing-v2.png" alt="Alfa Radio logo" class="logo">
  <h1>Alfa Online Radio</h1>

    <p>Christian radio broadcasting in Siswati and other languages.</p>

    <a class="button" href="https://siswati.alfaradio.co.za">
      Listen in Siswati
    </a>

    <p style="margin-top:2rem; font-size:0.9rem;">
      More languages coming soon.
    </p>
  </main>
</body>
</html>
