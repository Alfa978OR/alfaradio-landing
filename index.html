<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Alfa Online Radio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Radio Alfa – Christian radio broadcasting in siSwati and isiZulu.">

  <!-- SEO -->
  <link rel="canonical" href="https://alfaradio.co.za">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0f172a">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Alfa Online Radio">
  <meta property="og:description" content="Christian radio broadcasting in siSwati and isiZulu.">
  <meta property="og:url" content="https://alfaradio.co.za">
  <meta property="og:image" content="/og-image.png">

  <meta name="twitter:card" content="summary_large_image">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }

    main {
      text-align: center;
      max-width: 520px;
      padding: 2rem;
      margin: auto;
      animation: fadeUp 0.8s ease-out;
    }

    .logo {
      width: 100%;
      height: auto;
      margin-bottom: 1.2rem;
      max-width: 160px;
    }

    @media (min-width: 640px) {
      .logo {
        max-width: 220px;
      }
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    p {
      opacity: 0.9;
      line-height: 1.5;
    }

    /* Button group */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 1.6rem;
    }

    /* Base button */
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.9rem 1.2rem;
      border-radius: 0.6rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }

    a.button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
    }

    /* SiSwati – Blue */
    .btn-siswati {
      background: #38bdf8;
      color: #082f49;
    }

    .btn-siswati:hover {
      background: #0ea5e9;
    }

    /* IsiZulu – Green */
    .btn-isizulu {
      background: #22c55e;
      color: #052e16;
    }

    .btn-isizulu:hover {
      background: #16a34a;
    }

    /* Info buttons – Red */
    .btn-info {
      background: #ef4444;
      color: #450a0a;
    }

    .btn-info:hover {
      background: #dc2626;
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

  <!-- Cloudflare Web Analytics -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
          data-cf-beacon='{"token": "0505b11108564b33b0d5d66509727745"}'>
  </script>
</head>

<body>
  <main>
    <img src="/alfa-logo-landing-v3.png" alt="Alfa Radio logo" class="logo">

    <h1>Alfa Online Radio</h1>

    <p>Christian radio broadcasting in siSwati and isiZulu.</p>

    <div class="buttons">
      <!-- Siswati -->
      <a class="button btn-siswati"
         href="https://siswati.alfaradio.co.za"
         onclick="if (window.cfBeacon) cfBeacon.trackEvent('siswati_listen');">
        🎧 Listen in siSwati
      </a>

      <a class="button btn-info"
         href="https://alfaradio.co.za/info-siswati"
         onclick="if (window.cfBeacon) cfBeacon.trackEvent('siswati_info');">
        ℹ️ Info (siSwati)
      </a>

      <!-- IsiZulu -->
      <a class="button btn-isizulu"
         href="https://isizulu.alfaradio.co.za/"
         onclick="if (window.cfBeacon) cfBeacon.trackEvent('isizulu_listen');">
        🎧 Listen in isiZulu
      </a>

      <a class="button btn-info"
         href="https://alfaradio.co.za/info-isizulu">
        ℹ️ Info (isiZulu)
      </a>
    </div>

    <p style="margin-top:2rem; font-size:0.9rem;">
      More content coming soon.
    </p>
  </main>

  <footer>
    © 2026 Alfa Online Radio
  </footer>
</body>
</html>
