<head>
  <meta charset="utf-8">
  <title>Alfa Online Radio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Alfa Radio – Christian radio broadcasting in Siswati and other languages.">

  <link rel="canonical" href="https://alfaradio.co.za">

  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0f172a">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Alfa Online Radio">
  <meta property="og:description" content="Christian radio broadcasting in Siswati and other languages.">
  <meta property="og:url" content="https://alfaradio.co.za">
  <meta property="og:image" content="https://alfaradio.co.za/og-image.png">

  <meta name="twitter:card" content="summary_large_image">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    main {
      text-align: center;
      max-width: 500px;
      padding: 2rem;
      animation: fadeUp 0.8s ease-out;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    p {
      opacity: 0.9;
    }

    a.button {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.8rem 1.2rem;
      background: #22c55e;
      color: #052e16;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
    }

    a.button:hover {
      background: #16a34a;
    }

    .logo {
      width: 100%;
      height: auto;
      margin-bottom: 1.2rem;
      max-width: 140px;
    }

    @media (min-width: 640px) {
      .logo {
        max-width: 200px;
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
